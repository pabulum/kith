# Every push and pull request: formatting, lints and tests on Linux and on
# Windows, the end-to-end smoke test on Linux, and on real Windows the parts
# Wine can't stand in for (scripts/windows-smoke.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install what the smoke test runs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mpv dbus python3-gi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: scripts/smoke.sh

  ffmpeg:
    # The trimmed ffmpeg.exe, built again only when its script changes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: target/ffmpeg-windows/out
          key: ffmpeg-windows-${{ hashFiles('scripts/ffmpeg-windows.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/ffmpeg-windows.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows
          path: target/ffmpeg-windows/out/ffmpeg.exe

  windows:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-windows
          path: ffmpeg
      - run: scripts/windows-smoke.sh ffmpeg/ffmpeg.exe
        shell: bash
