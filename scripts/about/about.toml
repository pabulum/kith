# cargo-about: which licenses may be compiled into a release, for
# scripts/release.sh's THIRD-PARTY-LICENSES.txt. A dependency under anything
# else fails the release until someone decides it's fine.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "OpenSSL",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
